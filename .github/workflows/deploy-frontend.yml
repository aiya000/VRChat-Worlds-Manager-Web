name: Deploy Frontend
on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CF_WORKER_URL: https://vrchat-worlds-manager-web-backend.vrchat-worlds-manager-web.workers.dev
          # A public identifier, kept as a repository variable rather than a
          # secret. Unset, the app asks for no bot check (#61).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Deploy
        run: bun run deploy -- --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_FRONTEND }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
