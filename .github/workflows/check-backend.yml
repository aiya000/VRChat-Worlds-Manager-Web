name: Check Backend
# Only the Worker is checked here, so only a change to it is a reason to run.
# The workflow file itself is included so a change to this list is exercised.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'worker/**'
      - '.github/workflows/check-backend.yml'
  pull_request:
    types:
      - reopened
      - opened
      - synchronize
    paths:
      - 'worker/**'
      - '.github/workflows/check-backend.yml'

# A newer push to the same branch or PR makes the run in flight moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Prettier, ESLint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
      - name: Install dependencies
        run: bun install
      - name: Prettier, ESLint, and TypeCheck
        run: bun run check
