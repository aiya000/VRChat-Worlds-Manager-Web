name = "vrchat-worlds-manager-web-backend"
# Not `index.ts`: see the comment at the top of `worker.ts`.
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated, and the first entry is what an origin this Worker turned
# away is answered with. `vrcww.com` is the app's own domain; the `pages.dev`
# one is kept because installed PWAs and bookmarks still reach the app there,
# and listing it also keeps every branch preview working (`*.<project>.pages.dev`
# is allowed by the rule in `isOriginAllowed`). `develop.vrcww.com` is named
# outright: a custom domain's subdomains are not allowed on their own.
ALLOWED_ORIGIN = "https://vrcww.com,https://develop.vrcww.com,https://vrchat-worlds-manager-web.pages.dev"
VRCHAT_API_BASE = "https://api.vrchat.cloud/api/1"

# The limits (#171). This file is what production runs with -- the deploy
# copies it to `wrangler.toml` -- so changing a number here and releasing is
# how a limit is changed. Each must be a positive integer; anything else falls
# back to `DEFAULT_LIMITS` in `src/index.ts`, with an error in the logs.
#
# Relays one IP address may make in a UTC day. Purging VRChat's favourites
# sends one request per favourite, so keep this above the few hundred a person
# with a full favourites list needs.
IP_DAILY_LIMIT = "1000"
# Sign-in attempts (password and two-factor code alike) per IP address per hour.
LOGIN_HOURLY_LIMIT = "30"
# Relays the whole Worker may make in a UTC day, everyone together.
DAILY_QUOTA = "90000"

# Every limit is counted here. SQLite-backed, which is what the free plan
# offers: 100,000 written rows a day against KV's 1,000 writes, which the
# counters used to use up at about 500 requests a day (#171).
[[durable_objects.bindings]]
name = "USAGE_COUNTER"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# Without this, the only way to learn that this Worker refused somebody is to
# be watching `wrangler tail` at the moment it happened -- nothing is kept
# (#170). With it on, every `console.error` below is retained and searchable
# in the Cloudflare dashboard under Workers > this Worker > Logs.
#
# `wrangler.toml` is not tracked, so adding this here changes nothing on its
# own: copy the block into your own `wrangler.toml` and deploy.
[observability]
enabled = true
head_sampling_rate = 1

# Secrets are not listed here. `TURNSTILE_SECRET_KEY` (the Turnstile widget's
# secret, #61) is set once with `bunx wrangler secret put TURNSTILE_SECRET_KEY`
# and survives every `wrangler deploy`. Without it the Worker asks credential
# attempts for no bot check.
